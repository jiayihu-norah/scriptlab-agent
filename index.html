<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ScriptLab · 剧本创作 Agent</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;color:#e9eaf6;background:#0d1020}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0%,#262047 0,transparent 42%),#0d1020}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}header{position:sticky;top:0;z-index:10;background:#111426e8;backdrop-filter:blur(16px);border-bottom:1px solid #30334a;padding:13px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}header b{font-size:19px}header small{color:#aaaed0}.pill{border:1px solid #535777;border-radius:30px;padding:6px 10px;font-size:12px;color:#b7bde0}main{max-width:1190px;margin:auto;padding:20px}.intro{margin:4px 0 20px}.intro h1{margin:0 0 6px;font-size:26px}.intro p{color:#a9acc8;margin:0;line-height:1.7}.tabs{display:flex;overflow:auto;gap:8px;padding-bottom:10px;margin-bottom:12px}.tab{white-space:nowrap;background:#1a1e34;color:#b9bddd;border:1px solid #303551;border-radius:11px;padding:11px 13px}.tab.active{background:#6855cf;color:white;border-color:#9585f5}.panel{border:1px solid #343851;background:#171b30;border-radius:18px;padding:20px;margin-bottom:15px}.panel h2{font-size:19px;margin:0 0 10px}.muted{color:#adb2ce;line-height:1.65}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{border:1px solid #343a58;border-radius:13px;background:#20243b;padding:14px}.card label{font-size:12px;color:#b7bad5;display:block;margin-bottom:8px}.card strong{font-size:16px;line-height:1.55;display:block;min-height:50px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btn{padding:11px 15px;border-radius:10px;background:#6d59db;color:white;font-weight:650}.btn.secondary{background:#303653;color:#e5e6f6}.btn.outline{background:transparent;border:1px solid #515778;color:#d7dcf9}.btn:disabled{opacity:.45}.btn.small{padding:7px 9px;font-size:12px}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:15px}select,input,textarea{background:#11172c;border:1px solid #444a6b;color:#f3f3fa;border-radius:9px;padding:10px;max-width:100%}textarea{width:100%;min-height:85px;line-height:1.6}select{min-width:190px}.tag{display:inline-block;padding:5px 8px;background:#30345a;border-radius:8px;margin:3px;font-size:12px;color:#d5d8ff}.episode{border:1px solid #393e59;border-radius:12px;padding:13px;background:#20243b;text-align:left;color:#f0f0fa;min-height:126px}.episode b{display:block;margin-bottom:7px}.episode p{color:#bfc3dd;font-size:12px;line-height:1.55;margin:5px 0}.episode.selected{border-color:#a49aff;background:#302c59}.epgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.story{background:#20243b;padding:13px;border-radius:11px;margin-bottom:10px;line-height:1.7}.story b{color:#b4a8ff}.tablewrap{overflow:auto;border:1px solid #383d59;border-radius:12px}table{border-collapse:collapse;width:100%;min-width:880px;font-size:13px}th,td{border-bottom:1px solid #353a54;padding:10px;text-align:left;vertical-align:top}th{background:#292d48;position:sticky;top:0}td textarea{min-height:66px;width:200px;font-size:12px;padding:7px}td input{width:75px;padding:7px}tr:nth-child(even){background:#1d2138}.metric{background:#20243b;padding:14px;border-radius:12px;flex:1;min-width:120px}.metric strong{font-size:25px;display:block}.metric span{font-size:12px;color:#b7bcd7}.ok{color:#75dfb2}.warn{color:#ffbd7e}.hidden{display:none!important}.foot{font-size:12px;color:#a5a8c2;padding:20px 0;text-align:center}@media(max-width:760px){main{padding:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.epgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.panel{padding:14px}.intro h1{font-size:22px}header b{font-size:16px}.card{padding:11px}.card strong{font-size:14px}}@media(max-width:390px){.grid{grid-template-columns:1fr}}
</style></head><body><header><div><b>✦ ScriptLab Agent</b><br><small>AI 漫剧创作工作台 · iPad Demo</small></div><span class="pill">交互演示 V1.1</span></header><main><div class="intro"><h1>从灵感到可制作分镜</h1><p>3 个原创示例项目 · 24 集连续剧情 · 75 秒分镜 · 可编辑与导出。所有操作均可触屏完成。</p></div><div class="controls"><label>示例项目 <select id="project"></select></label><button class="btn secondary" onclick="resetProject()">重置当前项目</button></div><nav class="tabs" id="tabs"></nav><div id="content"></div><div class="foot">本页面为离线规则与原创预设驱动的可交互 Demo，尚未连接真实大模型或即梦 API。数据仅保存在当前浏览器。</div></main>
<script>
const cases=[
{title:'九命黑猫：新曙城2096',genre:'赛博悬疑',style:'3D动画 · 冷暖对比',lead:'林夜｜意外觉醒的黑猫兽人',world:'2096年的新曙城由AI「天穹」治理，人类的动物化觉醒被包装为进化计划。',conflict:'破解九个谜团，揭穿进化计划，找回人类身份',partner:'金发青年陆昼',secret:'每次重置都让林夜保留线索，却会抹去其他人对她的部分记忆',location:'新曙城霓虹街区',goal:'找到首枚失踪者密钥',beats:['林夜在陌生街道醒来，发现自己长出了猫耳','城市广播宣布对异常觉醒者展开筛查','林夜追踪闪烁的黑猫标记，遇见陆昼','陆昼递来一张写着「别相信系统」的旧照片','天空突然弹出倒计时，林夜发现自己的名字在通缉名单上'],arc:['觉醒与通缉','进入禁区','失踪者名单','假身份档案','地下研究站','第一次密钥','金发青年的谎言','监控盲区','回收站里的证人','记忆置换','伪造的审判','系统裂缝','陆昼的双重任务','被抹去的同伴','进化计划原型','九命机制真相','旧城停机夜','真正的幕后设计者','主角身份反转','倒计时重启','联手潜入核心','公开实验档案','对抗天穹','新曙城黎明']},
{title:'午夜归档：记忆典当行',genre:'都市奇幻',style:'电影感 · 暖金与墨绿',lead:'沈雾｜能够触摸他人记忆的档案员',world:'每到午夜，城市会出现一家只能用记忆交换愿望的典当行。',conflict:'找回被交易的童年记忆，阻止全城记忆失窃',partner:'失忆侦探顾临',secret:'典当行的账本记录的不是过去，而是未来即将发生的遗忘',location:'雨夜的旧城典当行',goal:'找出第一笔不存在的交易',beats:['沈雾收到一封写着自己笔迹的午夜邀请函','典当行柜台出现一段陌生童年的记忆','顾临拿出一张无法辨认面孔的合照','账本自动翻页，出现明天的日期','店门外的时钟倒走，第一位客人忘记了自己的名字'],arc:['午夜来信','不存在的客人','空白照片','借来的笑容','第三次午夜','旧账本','侦探的谎言','记忆失主','城市遗忘症','镜中档案','雨巷追踪','未发生的交易','典当规则漏洞','被封存的名字','共同的童年','账本反写','店主身份','消失的街区','未来的欠条','午夜审判','找回第一段记忆','全城归档','交换的代价','天亮以后']},
{title:'凤阙伪诏',genre:'古风权谋',style:'国风3D · 烛火与月色',lead:'谢知微｜精通笔迹与密文的女史',world:'架空王朝大晟，皇城中的每一道诏令都由密印阁存档。',conflict:'查明伪诏来源，在宫廷斗争中揭露预言骗局',partner:'冷面少卿裴砚',secret:'所谓天命预言，是有人提前安排的政治剧本',location:'大晟皇城密印阁',goal:'辨认第一道伪造的御诏',beats:['谢知微在密印阁发现一道印章错位的诏令','一名内侍匆忙取走卷宗，留下碎裂的封蜡','裴砚要求她在天亮前复原诏书','谢知微发现墨迹中藏着倒写的宫门编号','禁军忽然封锁密印阁，诏令上的名字竟是她自己'],arc:['错印御诏','封蜡密语','宫门暗号','无名女史','夜审密印阁','消失的抄手','少卿试探','假传圣旨','被改写的家谱','祭天前夜','密道旧卷','预言初现','太史局疑云','双份诏书','先帝遗案','伪造天命','旧盟反目','宫宴换印','真正的密令','兵临皇城','破局之证','当殿对质','预言骗局','凤阙新章']}
];
const fields=[['题材',['赛博悬疑','都市奇幻','古风权谋','末日冒险','校园推理']],['风格',['3D动画 · 冷暖对比','电影感 · 暖金与墨绿','国风3D · 烛火与月色','黑色幽默','热血冒险']],['主角',['林夜｜意外觉醒的黑猫兽人','沈雾｜能够触摸他人记忆的档案员','谢知微｜精通笔迹与密文的女史','被通缉的天才修理师']],['世界观',['2096年AI治理的觉醒都市','午夜出现的记忆典当行','密诏决定命运的架空王朝','被时间循环困住的海上小城']],['冲突',['破解九个谜团，揭穿进化计划','找回被交易的童年记忆','揭露伪诏与预言骗局','逃出无限循环']],['集数',['24集','12集','36集']]];
let state={caseId:0,step:0,selected:0,cards:[0,0,0,0,0,0],locks:[false,false,false,false,false,false],shots:null,script:null,approved:false};
const names=['01 创意抽卡','02 故事圣经','03 24集大纲','04 单集剧本','05 导演分镜','06 时长审核与导出'];
function C(){return cases[state.caseId]};function esc(s){return String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
function save(){try{localStorage.setItem('scriptlab_ipad_v11',JSON.stringify(state))}catch(e){}}
function init(){let o=document.getElementById('project');o.innerHTML=cases.map((c,i)=>`<option value="${i}">${esc(c.title)}</option>`).join('');try{let s=JSON.parse(localStorage.getItem('scriptlab_ipad_v11'));if(s&&Number.isInteger(s.caseId)&&s.caseId<cases.length)state=s}catch(e){}o.value=state.caseId;render()}
function resetProject(){state={caseId:state.caseId,step:0,selected:0,cards:[state.caseId===0?0:state.caseId,state.caseId===0?0:state.caseId,state.caseId===0?0:state.caseId,state.caseId===0?0:state.caseId,state.caseId===0?0:state.caseId,0],locks:[false,false,false,false,false,false],shots:null,script:null,approved:false};save();render()}
document.getElementById('project').addEventListener('change',e=>{state.caseId=+e.target.value;resetProject()});
function go(i){state.step=i;save();render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){document.getElementById('tabs').innerHTML=names.map((x,i)=>`<button class="tab ${state.step===i?'active':''}" onclick="go(${i})">${x}</button>`).join('');document.getElementById('content').innerHTML=[drawCards,bible,outline,scriptPage,shotsPage,review][state.step]();save()}
function drawCards(){return `<section class="panel"><h2>🎲 创意抽卡</h2><p class="muted">可以锁定喜欢的设定，重抽其他卡片。三套案例均有完整连续故事；随机组合属于创意草案，正式产品需调用 AI 校验兼容性。</p><div class="grid">${fields.map((f,i)=>`<div class="card"><label>${f[0]}　${state.locks[i]?'🔒 已锁定':'🔓 可重抽'}</label><strong>${esc(f[1][state.cards[i]%f[1].length])}</strong><div class="actions"><button class="btn small secondary" onclick="redraw(${i})" ${state.locks[i]?'disabled':''}>↻ 重抽</button><button class="btn small outline" onclick="lock(${i})">${state.locks[i]?'解锁':'锁定'}</button></div></div>`).join('')}</div><div class="actions"><button class="btn" onclick="redraw(-1)">🎲 重抽未锁定卡片</button><button class="btn secondary" onclick="go(1)">生成故事圣经 →</button></div></section>`}
function redraw(i){fields.forEach((f,j)=>{if((i===-1||i===j)&&!state.locks[j]){let prev=state.cards[j];state.cards[j]=(prev+1+Math.floor(Math.random()*(f[1].length-1)))%f[1].length}});render()}
function lock(i){state.locks[i]=!state.locks[i];render()}
function bible(){let c=C();return `<section class="panel"><h2>📖 故事圣经 · ${esc(c.title)}</h2><p class="muted">当前为已策划的示例案例，抽卡的自由组合不会自动改写本页内容。</p><div class="grid"><div class="card"><label>类型与画风</label><strong>${esc(c.genre)}</strong><p>${esc(c.style)}</p></div><div class="card"><label>主角设定</label><strong>${esc(c.lead)}</strong></div><div class="card"><label>关键搭档</label><strong>${esc(c.partner)}</strong></div></div><div class="story"><b>世界观</b><p>${esc(c.world)}</p></div><div class="story"><b>全剧主线</b><p>${esc(c.conflict)}</p></div><div class="story"><b>隐藏规则 / 核心伏笔</b><p>${esc(c.secret)}</p></div><div class="story"><b>核心场景</b><p>${esc(c.location)}</p></div><div class="actions"><button class="btn" onclick="go(2)">展开 24 集大纲 →</button></div></section>`}
function ep(i){let c=C();return {n:i+1,title:c.arc[i],goal:i===0?c.goal:`围绕「${c.arc[i]}」获取关键线索`,hook:i===23?'主线真相揭晓，留下新的生活选择':`新的线索将主角引向「${c.arc[i+1]}」`,phase:i<5?'设定与引入':i<12?'调查与升级':i<20?'反转与真相':'高潮与收束'}}
function outline(){return `<section class="panel"><h2>🗂 24 集连续剧情大纲</h2><p class="muted">按故事弧线展开；点击任意一集进入剧本页面。第 1 集配备更完整的预设剧情，其余集数为可演示的结构化草案。</p><div class="epgrid">${Array.from({length:24},(_,i)=>{let e=ep(i);return `<button class="episode ${state.selected===i?'selected':''}" onclick="selectEp(${i})"><b>EP ${String(i+1).padStart(2,'0')} · ${esc(e.title)}</b><span class="tag">${e.phase}</span><p>${esc(e.goal)}</p><p>悬念：${esc(e.hook)}</p></button>`}).join('')}</div></section>`}
function selectEp(i){state.selected=i;state.script=null;state.shots=null;go(3)}
function getBeats(){let c=C(),i=state.selected;if(i===0)return c.beats;let e=ep(i);return [`主角在${c.location}发现与「${e.title}」有关的异常`,`主角与${c.partner}交换线索，却产生新的分歧`,`调查触及${e.title}背后的隐藏规则`,`主角冒险取得证据，却发现其中存在矛盾`,`新的线索出现，指向下一集：${i===23?'真相后的选择':c.arc[i+1]}`]}
function getScript(){let c=C(),b=getBeats(),i=state.selected;return b.map((x,j)=>({beat:j+1,time:[9,15,20,19,12][j],place:c.location,action:x,dialogue:j===0?`${c.lead.split('｜')[0]}：这里究竟发生了什么？`:j===2?`${c.partner.split(' ')[0]}：你看到的未必是真相。`:j===4?'旁白：真正的谜题，才刚刚开始。':'',emotion:['疑惑','紧张','试探','惊讶','悬念'][j]}))}
function scriptPage(){let c=C(),b=state.script||getScript(),e=ep(state.selected);return `<section class="panel"><h2>✍️ 第 ${e.n} 集 · ${esc(e.title)}</h2><div class="controls"><span class="tag">目标 75 秒</span><span class="tag">5 个剧情节拍</span><span class="tag">${esc(e.phase)}</span></div><p class="muted">本集目标：${esc(e.goal)}。可编辑动作与对白；点击按钮生成 15 镜头分镜。</p>${b.map((v,j)=>`<div class="story"><b>节拍 ${j+1} · ${v.time} 秒 · ${v.emotion}</b><p>${esc(v.action)}</p><p>${esc(v.dialogue||'（无对白，环境音推动剧情）')}</p></div>`).join('')}<div class="actions"><button class="btn" onclick="generateShots()">🎬 自动拆分为导演分镜 →</button><button class="btn secondary" onclick="go(2)">返回大纲</button></div></section>`}
const sizes=['远景','中景','近景','特写','中近景','特写','全景','中景','特写','近景','中景','特写','远景','近景','特写'];const angles=['俯拍','平视','仰拍','平视','侧面','平视','俯拍','平视','侧面','仰拍','平视','俯拍','平视','侧面','特写视角'];const moves=['缓推','固定','上摇','横移','固定','缓推','拉远','固定','快速推近','固定','横移','缓推','固定','上摇','定格'];
function generateShots(){let c=C(),b=state.script||getScript();state.script=b;state.shots=Array.from({length:15},(_,i)=>{let beat=Math.floor(i/3),part=i%3,source=b[beat],time=[3,3,3,5,5,5,6,7,7,5,7,7,3,4,5][i];let who=i%4===2?c.partner:c.lead.split('｜')[0];return {id:`EP${String(state.selected+1).padStart(2,'0')}-S${String(i+1).padStart(3,'0')}`,scene:source.place,people:who,duration:time,action:source.action+(part===0?'，人物开始观察环境':part===1?'，注意到关键细节':'，反应与情绪进一步变化'),visual:`${who}，${sizes[i]}，${angles[i]}，${part===1?'三分法构图':'层次分明的中心构图'}，${c.style}，电影级体积光`,camera:moves[i],dialogue:part===1?source.dialogue:'',prompt:`${who}，${sizes[i]}，${angles[i]}，${c.style}，${source.action}，精细3D质感，9:16竖屏`}});go(4)}
function changeShot(i,key,value){if(key==='duration')value=Number(value);state.shots[i][key]=value;save()}
function shotsPage(){if(!state.shots)return `<section class="panel"><h2>🎬 导演分镜</h2><p>请先生成单集剧本，再拆分镜头。</p><button class="btn" onclick="go(3)">前往单集剧本</button></section>`;return `<section class="panel"><h2>🎥 第 ${state.selected+1} 集 · 15 镜头导演分镜</h2><p class="muted">可直接修改镜头时长、动作和画面描述；改动将用于 QA 与导出。横向滑动表格可查看全部字段。</p><div class="tablewrap"><table><thead><tr><th>镜号</th><th>秒</th><th>场景</th><th>人物</th><th>动作描述</th><th>主画面描述</th><th>运镜</th><th>台词</th></tr></thead><tbody>${state.shots.map((s,i)=>`<tr><td>${s.id}</td><td><input type="number" min="1" max="30" value="${s.duration}" onchange="changeShot(${i},'duration',this.value)"></td><td>${esc(s.scene)}</td><td>${esc(s.people)}</td><td><textarea onchange="changeShot(${i},'action',this.value)">${esc(s.action)}</textarea></td><td><textarea onchange="changeShot(${i},'visual',this.value)">${esc(s.visual)}</textarea></td><td>${esc(s.camera)}</td><td><textarea onchange="changeShot(${i},'dialogue',this.value)">${esc(s.dialogue)}</textarea></td></tr>`).join('')}</tbody></table></div><div class="actions"><button class="btn" onclick="go(5)">检查时长并导出 →</button><button class="btn secondary" onclick="generateShots()">重新生成分镜</button></div></section>`}
function qa(){let s=state.shots||[],total=s.reduce((a,b)=>a+Number(b.duration||0),0),missing=s.filter(x=>!x.id||!x.scene||!x.people||!x.visual||!x.action||!Number.isFinite(x.duration)||x.duration<=0).length,ids=new Set(s.map(x=>x.id));return {total,missing,unique:ids.size===s.length,ok:total===75&&missing===0&&ids.size===s.length}}
function review(){if(!state.shots)return `<section class="panel"><h2>🧪 时长审核</h2><p>请先生成分镜。</p><button class="btn" onclick="go(3)">前往剧本</button></section>`;let q=qa();return `<section class="panel"><h2>🧪 QA 检查与文件导出</h2><div class="controls"><div class="metric"><strong class="${q.total===75?'ok':'warn'}">${q.total}s</strong><span>当前总时长 / 目标 75s</span></div><div class="metric"><strong>${state.shots.length}</strong><span>镜头总数</span></div><div class="metric"><strong class="${q.missing===0?'ok':'warn'}">${q.missing}</strong><span>必填字段异常</span></div><div class="metric"><strong class="${q.ok?'ok':'warn'}">${q.ok?'通过':'待调整'}</strong><span>规则审核状态</span></div></div><div class="story"><b>规则审核报告</b><p>${q.total===75?'✓ 镜头总时长符合 75 秒目标。':`⚠ 当前 ${q.total} 秒，偏差 ${q.total-75>0?'+':''}${q.total-75} 秒，请回到分镜调整。`}</p><p>${q.missing===0?'✓ 必填字段完整。':`⚠ ${q.missing} 个镜头存在字段缺失或无效时长。`}</p><p>${q.unique?'✓ 镜号唯一。':'⚠ 存在重复镜号。'}</p><p>注意：剧情合理性、AI 画面质量及实际配音时长仍需人工验证。</p></div><div class="actions"><button class="btn" onclick="exportExcel()">⬇ 下载 Excel（.xlsx）</button><button class="btn secondary" onclick="exportCSV()">下载 CSV 备用</button><button class="btn secondary" onclick="exportJSON()">下载 JSON</button><button class="btn outline" onclick="go(4)">返回编辑分镜</button></div><p class="muted" id="exportmsg">Excel 采用浏览器原生生成，不需要联网或外部库。</p></section>`}
function download(blob,name){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}
function filename(ext){return `ScriptLab_${state.caseId+1}_EP${String(state.selected+1).padStart(2,'0')}.${ext}`}
const cols=['镜号','场景','人物','镜头时长(秒)','动作描述','主画面描述','运镜','台词','AI提示词'];function rows(){return [cols,...state.shots.map(s=>[s.id,s.scene,s.people,s.duration,s.action,s.visual,s.camera,s.dialogue,s.prompt])]}
function exportCSV(){let txt='\ufeff'+rows().map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download(new Blob([txt],{type:'text/csv;charset=utf-8'}),filename('csv'))}
function exportJSON(){download(new Blob([JSON.stringify({project:C().title,episode:state.selected+1,bible:C(),outline:Array.from({length:24},(_,i)=>ep(i)),script:state.script,shots:state.shots,qa:qa()},null,2)],{type:'application/json'}),filename('json'))}
// Self-contained XLSX generator: OOXML ZIP stored method, CRC32 and central directory.
const te=new TextEncoder();function crc32(buf){let c=~0;for(let b of buf){c^=b;for(let j=0;j<8;j++)c=(c>>>1)^((c&1)?0xedb88320:0)}return (~c)>>>0}function u16(n){return [n&255,(n>>>8)&255]}function u32(n){return [n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255]}function zip(files){let local=[],central=[],offset=0;for(let [name,content] of files){let n=te.encode(name),data=te.encode(content),crc=crc32(data),head=Uint8Array.from([...u32(0x04034b50),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(data.length),...u32(data.length),...u16(n.length),...u16(0),...n]);local.push(head,data);central.push(Uint8Array.from([...u32(0x02014b50),...u16(20),...u16(20),...u16(0),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(data.length),...u32(data.length),...u16(n.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(offset),...n]));offset+=head.length+data.length}let size=central.reduce((a,b)=>a+b.length,0),end=Uint8Array.from([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(size),...u32(offset),...u16(0)]);return new Blob([...local,...central,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}
function xml(s){return String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[x])).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,'')}
function sheet(data){return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"/></sheetViews><sheetFormatPr defaultRowHeight="18"/><sheetData>${data.map((row,i)=>`<row r="${i+1}">${row.map((v,j)=>{let col='';let n=j+1;while(n){col=String.fromCharCode(65+(n-1)%26)+col;n=Math.floor((n-1)/26)}return typeof v==='number'?`<c r="${col}${i+1}"><v>${v}</v></c>`:`<c r="${col}${i+1}" t="inlineStr"><is><t xml:space="preserve">${xml(v)}</t></is></c>`}).join('')}</row>`).join('')}</sheetData></worksheet>`}
function exportExcel(){let c=C(),sheets=[['分镜脚本',rows()],['故事圣经',[['字段','内容'],['剧名',c.title],['题材',c.genre],['风格',c.style],['主角',c.lead],['搭档',c.partner],['世界观',c.world],['核心冲突',c.conflict],['隐藏规则',c.secret]]],['24集大纲',[['集数','标题','剧情目标','结尾钩子','阶段'],...Array.from({length:24},(_,i)=>{let e=ep(i);return [e.n,e.title,e.goal,e.hook,e.phase]})]]],files=[];files.push(['[Content_Types].xml',`<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>${sheets.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`]);files.push(['_rels/.rels',`<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`]);files.push(['xl/workbook.xml',`<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s,i)=>`<sheet name="${xml(s[0])}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`]);files.push(['xl/_rels/workbook.xml.rels',`<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((_,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}</Relationships>`]);sheets.forEach((s,i)=>files.push([`xl/worksheets/sheet${i+1}.xml`,sheet(s[1])]));download(zip(files),filename('xlsx'));let m=document.getElementById('exportmsg');if(m)m.textContent='已请求浏览器下载 Excel。iPad 可在 Safari 下载管理器或「文件」App 中查看。'}
init();
</script></body></html>
